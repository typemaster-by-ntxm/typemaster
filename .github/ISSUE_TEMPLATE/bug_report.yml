name: Bug report
description: Something in TypeMaster did not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please **do not attach private files**.
        For a security problem, email contact@ntxm.org instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: TypeMaster version
      description: The version in the installer file name, for example 0.1.2.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other (please describe below)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Installer
        - Story Mode
        - Typing levels
        - Coding practice
        - Settings, themes or sound
        - Saving progress
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact message you saw, if any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Stories ...
        2. Choose a story ...
        3. Start typing ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: story
    attributes:
      label: Story or lesson name (if it applies)
